name: BE CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'be/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/be

# 같은 PR에 새 커밋이 푸시되면 진행 중인 이전 실행을 취소한다 (러너 시간 절약)
concurrency:
  group: be-ci-${{ github.ref }}
  cancel-in-progress: true

# test와 image-scan은 서로 독립이다(이미지 빌드는 builder 스테이지에서 자체적으로 소스를 컴파일).
# 한 잡에서 순차로 돌리면 wall-clock = 합(테스트+이미지빌드)이 되므로 별도 잡으로 병렬 실행한다.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build`가 아니라 `check`다. bootJar는 image-scan 잡이 Dockerfile builder 스테이지에서
      # 어차피 만들고, 여기서 또 만들 이유가 없다.
      - name: Test and Checkstyle
        working-directory: be
        env:
          # 러너는 잡이 끝나면 통째로 버려진다. 남은 컨테이너를 걷어낼 ryuk를 띄울 이유가 없다.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./gradlew check

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # CD와 동일한 이미지 취약점 게이트를 PR 단계에서도 검사한다.
      # CD에만 두면 머지 후에야 push가 막혀 배포가 조용히 실패한다.
      # gha 캐시로 Docker 빌더 stage의 Gradle 의존성/컴파일 레이어를 재사용한다.
      # scope=be로 BE CI/CD가 캐시를 공유한다(CD가 이 캐시를 재사용해 빠르게 빌드).
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: be
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-scan
          build-args: |
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
