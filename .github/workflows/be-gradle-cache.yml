name: BE Gradle Cache

on:
  push:
    branches: [ main ]
    paths:
      - 'be/**'

# PR CI가 읽을 Gradle 캐시를 main에서 채운다.
#
# setup-gradle은 기본 브랜치에서만 캐시를 쓴다(PR 실행은 cache-read-only). 그런데 main에서
# Gradle이 도는 워크플로우가 하나도 없었다 — be-ci는 pull_request 전용이고, be-cd는 Docker
# 안에서 빌드한다. 그래서 모든 PR이 "Gradle User Home cache not found"로 시작해 gradle
# 배포판부터 전 의존성을 새로 받고 있었다.
concurrency:
  group: be-gradle-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 의존성과 컴파일·checkstyle 결과를 캐시에 남긴다. 테스트는 PR에서 이미 게이트를
      # 통과했으므로 여기서 다시 돌리지 않는다.
      - name: Warm dependency and build cache
        working-directory: be
        run: ./gradlew testClasses checkstyleMain checkstyleTest
