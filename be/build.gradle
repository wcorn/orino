plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'

    group = 'ds.project'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // BOM보다 높은 버전이 필요한 것만 남긴다(CVE 대응). 나머지는 4.0.7 BOM이 이미 커버한다.
    ext['netty.version'] = '4.2.16.Final'
    // CVE-2026-65182 · 65905 · 68525 (전부 CRITICAL, 인증·인가 우회). BOM은 11.0.22다.
    ext['tomcat.version'] = '11.0.25'

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.7"
        }
    }

    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    /*
     * javac는 기본적으로 "Some input files use or override a deprecated API" 한 줄만 남긴다 —
     * 어디인지는 말해 주지 않아서, 그 줄은 읽어도 할 수 있는 게 없는 로그였다.
     * 위치까지 찍게 해 둔다. 지금 기준으로 경고는 0이다.
     */
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
    }

    checkstyle {
        toolVersion = '10.25.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    /*
     * 커버리지는 달라고 할 때만 잰다. CI에는 리포트를 읽는 곳이 없는데(codecov도 sonar도
     * 아티팩트 업로드도 없다) 에이전트가 전 클래스를 계측하는 값은 매번 치르고 있었다 —
     * 3포크 기준으로 껐을 때 3분09초가 2분51초가 됐다.
     *
     * 커버리지를 볼 땐 `./gradlew test -Pcoverage`.
     */
    def coverageEnabled = project.hasProperty('coverage')

    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        jacoco {
            enabled = coverageEnabled
        }
        if (coverageEnabled) {
            finalizedBy jacocoTestReport
        }

        /*
         * 포크를 하나만 쓰면 1300개가 넘는 테스트가 JVM 하나에서 줄을 선다. 코어의 절반씩
         * 나눠 준다 — 포크마다 JVM과 스프링 컨텍스트와 테스트컨테이너가 따로 서므로,
         * 코어 수만큼 띄우면 컨테이너 기동과 테스트가 같은 CPU를 두고 싸운다.
         * GitHub 러너(4 vCPU)에서 2, 8코어 로컬에서 4가 된다.
         */
        maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))

        /*
         * 테스트 JVM의 한계를 선언한 적이 없어 Gradle 기본값(힙 512m)으로 돌고 있었다.
         * 스프링 컨텍스트가 다섯 벌 캐시되고 jacoco가 전 클래스를 계측하는 스위트라,
         * 남는 여유는 "지금 이 기계에 램이 얼마나 있는가"에 달려 있었다 — 로컬은 통과하고
         * CI에서만 테스트 JVM이 클래스 로딩 중 OutOfMemoryError로 죽은 이유가 그것이다.
         *
         * 테스트를 줄여 512m에 맞출 값이 아니라, 처음부터 정했어야 할 값이다.
         * 메타스페이스도 함께 준다 — 컨텍스트마다 프록시 클래스가 쌓이는 쪽이 힙보다 먼저
         * 바닥나고, 그때 나는 오류는 힙 부족과 구분되지 않는다.
         *
         * 아래 값은 포크 하나당이다. 포크가 늘면 그만큼 곱해진다.
         */
        maxHeapSize = '2g'
        jvmArgs '-XX:MaxMetaspaceSize=1g'

        /*
         * JNA(도커 API 호출)와 netty(lettuce)가 네이티브 라이브러리를 연다. JDK 25는
         * 그때마다 "restricted method has been called"를 stderr로 찍고, 앞으로는 아예
         * 막겠다고 예고한다. 이 JVM에서 네이티브 접근을 허용한다고 선언해 둔다.
         */
        jvmArgs '--enable-native-access=ALL-UNNAMED'

        /*
         * Mockito가 ByteBuddy 에이전트를 런타임에 붙이면서 부트스트랩 클래스패스에 자기
         * jar를 얹는다. 그러면 JVM이 "Sharing is only supported for boot loader classes"를
         * 워커마다 찍는다 — CDS는 그 시점에 이미 반쯤 꺼진 상태다. 처음부터 끄고 조용히 간다.
         */
        jvmArgs '-Xshare:off'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }
}
