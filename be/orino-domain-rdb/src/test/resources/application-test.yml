spring:
  jpa:
    hibernate:
      # create-drop이 아니라 create다. create-drop은 컨텍스트가 닫힐 때(= JVM 셧다운 훅)
      # 모든 테이블에 drop을 날리는데, Testcontainers도 자기 셧다운 훅으로 컨테이너를 내린다.
      # 순서 보장이 없어 컨테이너가 먼저 죽으면 drop이 전부 실패하고 HHH000478이 테이블 수만큼
      # 로그를 덮는다. 컨테이너는 어차피 폐기되므로 종료 시 drop은 얻는 게 없다.
      ddl-auto: create
