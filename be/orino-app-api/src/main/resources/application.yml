spring:
  application:
    name: orino
  profiles:
    include:
      - mysql
      - actuator
      - redis
  # 종료 시 처리 중인 요청을 끝까지 마친 뒤 종료 (기본 IMMEDIATE → graceful)
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

# 노트 이미지 저장소(MinIO, S3 호환).
# endpoint는 브라우저가 presigned URL로 직접 PUT/GET 할 공개 주소(img.orino.dev).
# BE는 URL 서명만 하므로 이 주소로 네트워크 호출은 하지 않는다.
storage:
  image:
    endpoint: ${IMAGE_STORAGE_ENDPOINT:https://img.orino.dev}
    bucket: ${IMAGE_STORAGE_BUCKET:note-images}
    region: ${IMAGE_STORAGE_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    presign-expiry-seconds: ${IMAGE_STORAGE_PRESIGN_EXPIRY:300}

# Planner Google Calendar/Tasks 연동(BFF 프록시).
# client-id/secret은 운영에선 SealedSecret→환경변수, 로컬은 .env로 주입. 값은 Google Cloud Console 발급.
# redirect-uri는 Console에 등록한 승인 리디렉션 URI와 정확히 일치해야 한다.
planner:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/oauth/callback}
    # refresh_token 컬럼 암호화 대칭키(env 주입). 운영에서 변경하면 기존 토큰 복호화 불가 → 안정 유지.
    refresh-token-key: ${GOOGLE_REFRESH_TOKEN_KEY:default-dev-refresh-token-key-change-me}
    scopes:
      - https://www.googleapis.com/auth/calendar
      - https://www.googleapis.com/auth/tasks
    connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:5s}
    read-timeout: ${GOOGLE_READ_TIMEOUT:10s}
    retry-max-attempts: ${GOOGLE_RETRY_MAX_ATTEMPTS:2}
    retry-backoff: ${GOOGLE_RETRY_BACKOFF:200ms}
    oauth:
      authorization-uri: ${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      revoke-uri: ${GOOGLE_REVOKE_URI:https://oauth2.googleapis.com/revoke}
      calendar-api-base-url: ${GOOGLE_CALENDAR_API_BASE_URL:https://www.googleapis.com}
      tasks-api-base-url: ${GOOGLE_TASKS_API_BASE_URL:https://tasks.googleapis.com}
      # 콜백 후 리다이렉트할 FE base URL (local Vite 3000, prod orino.dev)
      frontend-url: ${FRONTEND_URL:http://localhost:3000}

# 공휴일(한국천문연구원 특일정보, 공공데이터포털 data 15012690) 동기화.
# service-key는 디코딩 일반 인증키. 운영=SealedSecret→env, 로컬=.secrets/.env. 매일 00:00(KST) job이 DB 갱신.
holiday:
  service-key: ${HOLIDAY_SERVICE_KEY:}
  base-url: ${HOLIDAY_API_BASE_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
  # 동기화 대상 연도 수(올해부터 N개년). 2 = 올해+내년.
  sync-years: ${HOLIDAY_SYNC_YEARS:2}
  connect-timeout: ${HOLIDAY_CONNECT_TIMEOUT:5s}
  read-timeout: ${HOLIDAY_READ_TIMEOUT:10s}

geocoding:
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    # Nominatim 정책상 식별 가능한 User-Agent 필수.
    user-agent: ${NOMINATIM_USER_AGENT:orino-lifelog/1.0 (https://orino.dev)}
    accept-language: ${NOMINATIM_ACCEPT_LANGUAGE:ko}
    # 초당 1회 이하(정책). 단일 사용자라 여유 있게.
    min-interval: ${NOMINATIM_MIN_INTERVAL:1s}
    reverse-ttl: ${NOMINATIM_REVERSE_TTL:30d}
    search-ttl: ${NOMINATIM_SEARCH_TTL:7d}
    connect-timeout: ${NOMINATIM_CONNECT_TIMEOUT:5s}
    read-timeout: ${NOMINATIM_READ_TIMEOUT:10s}

travel:
  places:
    # 키가 없으면 장소 기능만 꺼지고 앱은 정상 기동한다(2단계 전 환경·로컬 개발용).
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
    language-code: ${GOOGLE_PLACES_LANGUAGE:ko}
    # §4.7 — 검색 1시간, 장소 상세 30일.
    search-ttl: ${GOOGLE_PLACES_SEARCH_TTL:1h}
    details-ttl: ${GOOGLE_PLACES_DETAILS_TTL:30d}
    max-results: ${GOOGLE_PLACES_MAX_RESULTS:20}
    # 목적지 주변 우선(§1.5). 필터가 아니라 편향이라 반경 밖도 나올 수 있다.
    search-radius-m: ${GOOGLE_PLACES_RADIUS_M:20000}
    connect-timeout: ${GOOGLE_PLACES_CONNECT_TIMEOUT:5s}
    read-timeout: ${GOOGLE_PLACES_READ_TIMEOUT:10s}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces