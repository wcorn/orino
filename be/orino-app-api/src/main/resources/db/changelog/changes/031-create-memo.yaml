databaseChangeLog:
  - changeSet:
      id: 031-create-memo
      author: wcorn
      comment: |
        독립 메모장(Memo) 모듈용 memo 테이블 (#719).
        노트(note) 트리 스키마를 material_id 없이 미러링한다.
        Notion 스타일 트리: parent_id self-ref(자식 CASCADE), sort_order 형제 정렬.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: memo
      changes:
        - createTable:
            tableName: memo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_memo_member
                    references: member(id)
              - column:
                  name: parent_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: title
                  type: VARCHAR(200)
                  defaultValue: 제목 없음
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: JSON
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

        # 트리 조회용 인덱스 (member_id prefix → 멤버별 트리 + 형제 정렬)
        - createIndex:
            tableName: memo
            indexName: idx_memo_member_parent_sort
            columns:
              - column:
                  name: member_id
              - column:
                  name: parent_id
              - column:
                  name: sort_order

        # parent_id self-ref FK (부모 삭제 시 자손 CASCADE). 테이블 생성 후 추가.
        - addForeignKeyConstraint:
            constraintName: fk_memo_parent
            baseTableName: memo
            baseColumnNames: parent_id
            referencedTableName: memo
            referencedColumnNames: id
            onDelete: CASCADE
