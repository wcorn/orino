databaseChangeLog:
  - changeSet:
      id: 028-create-day-plan
      author: wcorn
      comment: |
        데일리 플랜(Day Plan) — orino가 진실인 "반복되는 하루 템플릿" (#608).
        day_plan(반복 규칙은 컬럼으로 분해) 1:N day_plan_block(타임박스). Google 무관.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: day_plan
      changes:
        - createTable:
            tableName: day_plan
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_day_plan_member
                    references: member(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: VARCHAR(20)
              - column:
                  name: freq
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: interval_val
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: by_day
                  type: VARCHAR(40)
              - column:
                  name: by_month_day
                  type: VARCHAR(80)
              - column:
                  name: starts_on
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: until
                  type: DATE
              - column:
                  name: enabled
                  type: BIT(1)
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: day_plan
            indexName: idx_day_plan_member_enabled
            columns:
              - column:
                  name: member_id
              - column:
                  name: enabled
        - createTable:
            tableName: day_plan_block
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_day_plan_block_plan
                    references: day_plan(id)
                    deleteCascade: true
              - column:
                  name: start_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIME
              - column:
                  name: label
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: chime
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: day_plan_block
            indexName: idx_day_plan_block_plan_sort
            columns:
              - column:
                  name: plan_id
              - column:
                  name: sort_order
