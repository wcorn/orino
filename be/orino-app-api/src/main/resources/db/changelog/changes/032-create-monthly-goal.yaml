databaseChangeLog:
  - changeSet:
      id: 032-create-monthly-goal
      author: wcorn
      comment: |
        월간 목표(monthly_goal) — (member, year, month)당 자유 텍스트 목표 1개 (PLN-008).
        year/month는 SMALLINT/TINYINT 대신 INT로 둔다(Hibernate validate 안전, 저장 차이 무의미).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: monthly_goal
      changes:
        - createTable:
            tableName: monthly_goal
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_monthly_goal_member
                    references: member(id)
              - column:
                  name: year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: month
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

        # 년월당 1개 보장
        - addUniqueConstraint:
            tableName: monthly_goal
            columnNames: member_id, year, month
            constraintName: uq_monthly_goal_member_ym
