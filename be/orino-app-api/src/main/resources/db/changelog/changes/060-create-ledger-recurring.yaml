databaseChangeLog:
  # 정기 항목 (#1263, Epic #1257 v1.5).
  #
  # 구독·보험·자동이체·고정비를 하나의 개념으로 둔다. `kind`는 표시·필터용 라벨이고
  # 동작(주기 계산·예정 생성·확정)은 전부 동일하다(확정 명세 §6.1).
  #
  # 중복 방지의 집행 지점은 여기가 아니라 057이 이미 심어 둔
  # `uk_ledger_tx_recurring_occurrence`(D-2)다. 이 파일은 그 자리를 채울 규칙을 만든다.
  #
  # 보험 속성(insurer·policy_no·coverage_until…)은 v2다. 값이 생기기 전에 세워 두면
  # 아무것도 말해 주지 않는 컬럼이 된다 — 059가 신용카드 컬럼을 v1에 넣지 않은 것과 같은 이유다.

  - changeSet:
      id: 060-create-ledger-recurring
      author: wcorn
      comment: 정기 항목 규칙. 회차는 저장하지 않고 이 한 행에서 파생 계산한다(D-5).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ledger_recurring
      changes:
        - createTable:
            tableName: ledger_recurring
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              # SUBSCRIPTION · FIXED_COST · INSURANCE · TRANSFER · INCOME
              # 표시·필터용 라벨이다. 동작은 전부 동일하다.
              - column:
                  name: kind
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: tx_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # 고정이면 실제 금액, 변동(공과금)이면 예상액.
              - column:
                  name: amount
                  type: BIGINT
                  constraints:
                    nullable: false
              # FIXED · VARIABLE. VARIABLE은 적힐 때 estimated 표시가 붙는다.
              - column:
                  name: amount_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # 결제 수단. 카드면 적히는 순간 그 카드 청구서에 편입된다(059의 편입 경로 그대로).
              - column:
                  name: asset_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: counter_asset_id
                  type: BIGINT
              - column:
                  name: category_id
                  type: BIGINT
              # WEEKLY · MONTHLY_DAY · MONTHLY_LAST · EVERY_N_MONTHS · YEARLY · EVERY_N_DAYS
              - column:
                  name: freq_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: freq_interval
                  type: SMALLINT
              # 일자(1~31) 또는 요일(1~7, 월=1)
              - column:
                  name: freq_day
                  type: TINYINT
              - column:
                  name: freq_month
                  type: TINYINT
              # AS_IS · PREV · NEXT. 한국 공휴일 기준이고 자료는 플래너 것을 재사용한다(D-3).
              - column:
                  name: business_day_policy
                  type: VARCHAR(20)
                  defaultValue: AS_IS
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              # NULL = 무기한. 점검 신호 ④가 이 NULL을 센다.
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: paused_from
                  type: DATE
              - column:
                  name: paused_to
                  type: DATE
              # ACTIVE · PAUSED · ENDED
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # 해지일. 소급 해지가 가능하므로 오늘보다 과거일 수 있다.
              - column:
                  name: ended_on
                  type: DATE
              - column:
                  name: cancel_url
                  type: VARCHAR(500)
              - column:
                  name: memo
                  type: VARCHAR(500)
              # 자동 기록의 하한. 등록 시점에 `max(start_date, 오늘)`로 박는다 —
              # 과거 시작일로 새 항목을 만들었다고 지난 6개월치가 쏟아지면 원장이 오염되고,
              # 그걸 되돌리는 건 사람 손이다.
              #
              # `created_at`으로 갈음하지 않는다. 그건 감사 메타데이터라 시간대·감사 설정이
              # 바뀌면 함께 흔들리고, 「언제부터 적기 시작하는가」는 그런 값에 기대선 안 되는
              # 도메인 값이다.
              - column:
                  name: posting_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ledger_recurring
            baseColumnNames: asset_id
            constraintName: fk_ledger_recurring_asset
            referencedTableName: ledger_asset
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: ledger_recurring
            baseColumnNames: counter_asset_id
            constraintName: fk_ledger_recurring_counter_asset
            referencedTableName: ledger_asset
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: ledger_recurring
            baseColumnNames: category_id
            constraintName: fk_ledger_recurring_category
            referencedTableName: ledger_category
            referencedColumnNames: id
        # 해지한 항목도 목록에서 사라지지 않는다(§6.6) — status로 걸러 읽는다.
        - createIndex:
            tableName: ledger_recurring
            indexName: idx_ledger_recurring_member_status
            columns:
              - column:
                  name: member_id
              - column:
                  name: status
      # 테이블째 지운다. 자동 롤백은 변경을 역순으로 되돌리는데, 인덱스를 FK보다 먼저 떼려
      # 하면 MySQL이 거부한다(055·056·059가 같은 이유로 남긴 순서 문제).
      rollback:
        - dropTable:
            tableName: ledger_recurring

  - changeSet:
      id: 060-create-ledger-recurring-override
      author: wcorn
      comment: 손댄 회차만 1행. 이 표가 D-5의 하이브리드를 성립시킨다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ledger_recurring_override
      changes:
        - createTable:
            tableName: ledger_recurring_override
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recurring_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # 규칙이 계산한 원래 예정일이다. 날짜를 옮겨도 이 값이 키다 —
              # 영업일 보정 결과를 키로 삼으면 공휴일 자료가 갱신될 때 키가 흔들리고,
              # 이미 적힌 회차가 다시 적힌다.
              - column:
                  name: occurrence_date
                  type: DATE
                  constraints:
                    nullable: false
              # AMOUNT · SKIP · MOVE · UNPAID · REVERTED
              # UNPAID와 SKIP을 절대 합치지 않는다 — 미납은 삭제가 아니라 여전히 내야 할 돈이다.
              - column:
                  name: action
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: BIGINT
              - column:
                  name: moved_to
                  type: DATE
              - column:
                  name: note
                  type: VARCHAR(200)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ledger_recurring_override
            baseColumnNames: recurring_id
            constraintName: fk_ledger_override_recurring
            referencedTableName: ledger_recurring
            referencedColumnNames: id
        # 한 회차에 한 행. 같은 회차를 두 번 손대면 덮어쓴다.
        - addUniqueConstraint:
            tableName: ledger_recurring_override
            columnNames: recurring_id, occurrence_date
            constraintName: uk_ledger_override
      rollback:
        - dropTable:
            tableName: ledger_recurring_override

  - changeSet:
      id: 060-create-ledger-recurring-amount-history
      author: wcorn
      comment: 금액 변경 이력. 점검 신호 ①(최근 인상)·②(장기 미변동)가 이 표를 읽는다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ledger_recurring_amount_history
      changes:
        - createTable:
            tableName: ledger_recurring_amount_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recurring_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ledger_recurring_amount_history
            baseColumnNames: recurring_id
            constraintName: fk_ledger_amount_history_recurring
            referencedTableName: ledger_recurring
            referencedColumnNames: id
        - createIndex:
            tableName: ledger_recurring_amount_history
            indexName: idx_ledger_amount_history_recurring
            columns:
              - column:
                  name: recurring_id
              - column:
                  name: effective_from
                  descending: true
      rollback:
        - dropTable:
            tableName: ledger_recurring_amount_history
