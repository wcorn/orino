databaseChangeLog:
  # 예약 알림 (#1078, Epic #1029 · 3단계).
  #
  # payload(제목·본문)를 저장하지 않는다. 발송 시점에 trip_activity를 조인해 조립한다 —
  # §4.2 재계산 트리거에 "제목 변경"이 없어서, 저장해두면 제목만 고친 일정이 옛 제목으로
  # 알림된다.
  #
  # 재계산은 삭제가 아니라 CANCELED 전이 + 신규 INSERT다. 알림이 왜 그 시각에 갔는지
  # (혹은 안 갔는지)를 나중에 추적할 수 있어야 한다.
  #
  # scheduled_at은 UTC 절대시각이다. 일정 시각은 여행 타임존의 벽시계 값이라(§4.1)
  # trip.timezone으로 환산해 넣는다 — 타임존을 바꾸면 이 값만 다시 계산된다.

  - changeSet:
      id: 049-create-push-notification
      author: wcorn
      comment: 예약 알림 1건. 스케줄러가 PENDING을 폴링해 발송한다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: push_notification
      changes:
        - createTable:
            tableName: push_notification
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trip_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notification_trip
                    references: trip(id)
                    deleteCascade: true
              # 아침 요약은 특정 일정에 매달리지 않는다 → NULL.
              - column:
                  name: activity_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_notification_activity
                    references: trip_activity(id)
                    deleteCascade: true
              # ACTIVITY · DEPARTURE · MORNING_SUMMARY
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # 아침 요약이 가리키는 날짜. 그 외에는 NULL.
              - column:
                  name: target_date
                  type: DATE
              # UTC 절대시각. 벽시계 시각을 trip.timezone으로 환산한 결과다.
              - column:
                  name: scheduled_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              # PENDING · SENT · FAILED · CANCELED
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: DATETIME(6)
              - column:
                  name: fail_reason
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

  - changeSet:
      id: 049-notification-due-index
      author: wcorn
      comment: 스케줄러 폴링(PENDING AND scheduled_at <= now). 30초마다 도는 쿼리다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_notification_due
      changes:
        - createIndex:
            tableName: push_notification
            indexName: idx_notification_due
            columns:
              - column:
                  name: status
              - column:
                  name: scheduled_at

  - changeSet:
      id: 049-notification-activity-index
      author: wcorn
      comment: 재계산 시 그 일정의 PENDING을 일괄 취소한다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_notification_activity
      changes:
        - createIndex:
            tableName: push_notification
            indexName: idx_notification_activity
            columns:
              - column:
                  name: activity_id
              - column:
                  name: status
