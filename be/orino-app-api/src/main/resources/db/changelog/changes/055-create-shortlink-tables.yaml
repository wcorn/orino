databaseChangeLog:
  # 단축 URL(링크) 모듈 스키마 (#1236, Epic #1246).
  #
  # 이 모듈의 존재 이유는 "한 번 뿌린 주소를 죽지 않게" 하는 것이다(명세 §1). 그래서 슬러그는
  # 불변 키이고, 삭제해도 행이 남아 UNIQUE(slug)가 재사용을 구조적으로 막는다(명세 §3.1).
  # 방문 2테이블(shortlink_visit · shortlink_visit_daily)은 통계 단계(#1240)에서 만든다.
  #
  # 불리언은 BIT(1)이다 — BOOLEAN으로 적으면 Hibernate validate가 깨진다(DB-Migration 문서).

  - changeSet:
      id: 055-create-shortlink
      author: wcorn
      comment: 링크 1건(SSOT). 슬러그가 불변 키이며 삭제 후에도 영구 점유한다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: shortlink
      changes:
        - createTable:
            tableName: shortlink
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # 소문자로 정규화해 저장한다. 자동 발급은 5자, 커스텀은 최대 32자(명세 §3).
              - column:
                  name: slug
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: target_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: memo
                  type: VARCHAR(255)
              # ACTIVE · DISABLED · DELETED. 만료는 상태가 아니라 expires_at으로 파생한다.
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: favorite
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # 사용자가 슬러그를 직접 지었는지. 화면의 「커스텀」 배지가 이 값을 본다.
              # 길이로는 판정할 수 없다 — 5자짜리 커스텀 슬러그가 자동 발급과 구분되지 않는다.
              - column:
                  name: custom_slug
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # BCrypt(60자). NULL이면 비밀번호 없음. 확인 화면은 #1244에서 붙는다.
              - column:
                  name: password_hash
                  type: VARCHAR(72)
              - column:
                  name: expires_at
                  type: DATETIME(6)
              # OG 프리뷰 결과(#1243). 지금은 항상 NULL이다.
              - column:
                  name: og_title
                  type: VARCHAR(255)
              - column:
                  name: og_image_url
                  type: VARCHAR(1024)
              - column:
                  name: og_fetched_at
                  type: DATETIME(6)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              # 소프트 삭제 시각. 행은 지우지 않는다 — 슬러그를 계속 물고 있어야 한다.
              - column:
                  name: deleted_at
                  type: DATETIME(6)
        # 리다이렉트 조회 경로이자 §3.1 영구 점유의 집행 지점.
        # deleted_at을 섞지 않는다 — "삭제된 것 제외 부분 UNIQUE"는 이 모듈에서 버그다.
        - createIndex:
            tableName: shortlink
            indexName: uk_shortlink_slug
            unique: true
            columns:
              - column:
                  name: slug
        # 목록: 멤버 스코프 역시간순.
        - createIndex:
            tableName: shortlink
            indexName: idx_shortlink_member_created
            columns:
              - column:
                  name: member_id
              - column:
                  name: created_at
                  descending: true
              - column:
                  name: id
                  descending: true
        # 즐겨찾기 섹션.
        - createIndex:
            tableName: shortlink
            indexName: idx_shortlink_member_favorite
            columns:
              - column:
                  name: member_id
              - column:
                  name: favorite
              - column:
                  name: created_at
                  descending: true
      # 테이블을 지우면 인덱스도 함께 사라진다. 자식 테이블 changeSet이 먼저 되돌아간다.
      rollback:
        - dropTable:
            tableName: shortlink

  - changeSet:
      id: 055-create-shortlink-tag
      author: wcorn
      comment: 링크 태그(0..N). moment_tag와 같이 정규화하지 않고 이름을 그대로 담는다.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: shortlink_tag
      changes:
        - createTable:
            tableName: shortlink_tag
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shortlink_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_shortlink_tag_shortlink
                    references: shortlink(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: shortlink_tag
            indexName: idx_shortlink_tag_link
            columns:
              - column:
                  name: shortlink_id
        # 사이드바 태그별 개수 집계.
        - createIndex:
            tableName: shortlink_tag
            indexName: idx_shortlink_tag_name
            columns:
              - column:
                  name: name
      # 자동 롤백은 인덱스를 먼저 지우려 드는데 FK가 (shortlink_id)를 쓰고 있어
      # MySQL이 거부한다. 테이블을 지우면 인덱스·FK가 함께 사라진다(054와 같은 이유).
      rollback:
        - dropTable:
            tableName: shortlink_tag

  - changeSet:
      id: 055-create-shortlink-target-history
      author: wcorn
      comment: 목적지 교체 이력. 최초 발급도 한 줄이다(명세 §5.1).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: shortlink_target_history
      changes:
        - createTable:
            tableName: shortlink_target_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shortlink_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_shortlink_history_shortlink
                    references: shortlink(id)
                    deleteCascade: true
              # 그 시점의 목적지. 현재 목적지는 shortlink.target_url이고 이력의 첫 줄과 같다.
              - column:
                  name: target_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(255)
              - column:
                  name: changed_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: shortlink_target_history
            indexName: idx_shortlink_history
            columns:
              - column:
                  name: shortlink_id
              - column:
                  name: changed_at
                  descending: true
      # 위와 같다 — FK가 이 인덱스를 쓰고 있어 인덱스만 따로 지울 수 없다.
      rollback:
        - dropTable:
            tableName: shortlink_target_history
