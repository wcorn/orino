databaseChangeLog:
  # 청약 인정 현황 (#1389). 데이터 모델 §7.1.
  #
  # 대출·마이너스통장 표(§7.2~§7.5)는 여기 넣지 않는다 — 각 단계에는 Hibernate validate가
  # 통과하는 최소 집합만 넣는다(§6). 컬럼만 서 있고 값이 없는 표를 먼저 세우지 않는다.
  #
  # 자동 롤백에 맡기지 않고 되돌리는 변경을 직접 적는다 — 066과 같은 이유다.

  - changeSet:
      id: 068-add-ledger-asset-savings-kind
      author: wcorn
      comment: 예·적금의 종류. 청약은 새 유형이 아니다(D-15, #1389).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: ledger_asset
                columnName: savings_kind
      changes:
        - addColumn:
            tableName: ledger_asset
            columns:
              # HOUSING_SUBSCRIPTION(청약). SAVINGS일 때만 채운다. NULL이면 일반 예·적금이다.
              #
              # 유형과 달리 바꿀 수 있다 — 잔액의 의미가 그대로이기 때문이다. 이미 예·적금으로
              # 만든 청약 통장을 새로 만들 필요가 없다.
              - column:
                  name: savings_kind
                  type: VARCHAR(20)
      rollback:
        - dropColumn:
            tableName: ledger_asset
            columns:
              - column:
                  name: savings_kind

  - changeSet:
      id: 068-create-ledger-housing-subscription
      author: wcorn
      comment: 청약홈 기준값. 인정 회차·금액은 저장하지 않고 기준값 + 원장으로 센다(D-18, #1389).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ledger_housing_subscription
      changes:
        - createTable:
            tableName: ledger_housing_subscription
            columns:
              # 자산과 1:1이다(D-20). 유형별 속성을 ledger_asset 컬럼으로 늘리지 않는다.
              - column:
                  name: asset_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              # 아래 셋은 함께 있거나 함께 없다. 없으면 추정을 그리지 않는다 —
              # 가입일부터 센 틀린 숫자보다 빈칸이 낫다.
              - column:
                  name: baseline_count
                  type: INT
              - column:
                  name: baseline_amount
                  type: BIGINT
              # 기준일이 아니라 기준 월(`2026-08`)이다. 「9/13 조회」로 받으면 9월 약정일이
              # 지났는지 알 수 없어 그 달을 두 번 세거나 빠뜨린다.
              - column:
                  name: baseline_through_month
                  type: CHAR(7)
              - column:
                  name: baseline_updated_at
                  type: DATETIME(6)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ledger_housing_subscription
            baseColumnNames: asset_id
            constraintName: fk_ledger_housing_subscription_asset
            referencedTableName: ledger_asset
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: ledger_housing_subscription
