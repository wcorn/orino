databaseChangeLog:
  - changeSet:
      id: 023-create-google-account
      author: wcorn
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: google_account
      changes:
        - createTable:
            tableName: google_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_google_account_member
                    foreignKeyName: fk_google_account_member
                    references: member(id)
              - column:
                  name: google_email
                  type: VARCHAR(255)
              - column:
                  name: refresh_token
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: scopes
                  type: VARCHAR(512)
              - column:
                  name: primary_calendar_id
                  type: VARCHAR(255)
              - column:
                  name: task_list_id
                  type: VARCHAR(255)
              - column:
                  name: connected_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
