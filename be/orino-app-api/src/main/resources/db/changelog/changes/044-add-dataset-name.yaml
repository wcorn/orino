databaseChangeLog:
  # 표 이름 (R9 표간 참조 기반, #916).
  #
  # 지금 표(dataset)는 사용자용 이름이 없어 노트 안 여러 표를 구별할 수 없다. name을 두면
  # 한 노트의 표들을 이름으로 가리킬 수 있고, 후속(#915) 표간 참조 수식이 {표!열}처럼 이름으로
  # 대상 표를 지목한다. nullable — 무명 표(기존)는 그대로 두어 마이그레이션이 필요 없다.
  - changeSet:
      id: 044-add-dataset-name
      author: wcorn
      comment: dataset.name 추가 — 표 사용자용 이름(nullable).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: dataset
                columnName: name
      changes:
        - addColumn:
            tableName: dataset
            columns:
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: dataset
            columnName: name
