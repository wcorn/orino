databaseChangeLog:
  - changeSet:
      id: 025-create-holiday
      author: wcorn
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: holiday
      changes:
        - createTable:
            tableName: holiday
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: holiday_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_holiday_date
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
