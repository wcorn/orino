databaseChangeLog:
  - changeSet:
      id: 024-create-routine-check
      author: wcorn
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: routine_check
      changes:
        - createTable:
            tableName: routine_check
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_routine_check_member
                    references: member(id)
              - column:
                  name: recurring_event_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: instance_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: checked_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: routine_check
            columnNames: member_id, recurring_event_id, instance_date
            constraintName: uk_routine_check_instance
        - createIndex:
            tableName: routine_check
            indexName: idx_routine_check_member_date
            columns:
              - column:
                  name: member_id
              - column:
                  name: instance_date
