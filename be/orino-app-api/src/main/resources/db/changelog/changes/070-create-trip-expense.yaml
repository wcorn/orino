databaseChangeLog:
  # 여행 경비 독립 (#1406, Epic #1405 — 가계부 제거의 0단계).
  #
  # 가계부가 없어지므로 여행 경비를 여행 전용 장부로 독립시킨다. 순서가 안전의 전부다 —
  # 이관이 끝나기 전에 ledger_transaction을 지우면 여행 지출 기록이 같이 사라진다.
  #
  # 자동 롤백에 맡기지 않고 changeSet마다 되돌릴 것을 적는다. 자동 롤백은 인덱스를 FK보다
  # 먼저 지우려 들고, MySQL이 그걸 거부해 롤백이 통째로 멈춘다(060에서 겪었다).

  - changeSet:
      id: 070-create-trip-expense
      author: wcorn
      comment: 여행 지출 한 줄 — 원장이 아니라 여행 하나의 지출 목록이다(경비 독립 §5.1).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: trip_expense
      changes:
        - createTable:
            tableName: trip_expense
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # FK는 아래에서 따로 건다 — ON DELETE CASCADE는 인라인 제약으로 표현할 수 없다.
              - column:
                  name: trip_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # 결제한 날 그대로다. 여행 기간 안으로 옮기지 않는다(D-34) —
              # 항공권은 출발 두 달 전에 사고, 그 날짜가 「출발 전」 묶음을 만든다.
              - column:
                  name: occurred_on
                  type: DATE
                  constraints:
                    nullable: false
              # NULL을 허용한다. 금액만 적고 저장하는 길이 이 기능의 핵심이다(§6.1).
              - column:
                  name: title
                  type: VARCHAR(100)
              # 원 단위 정수. 집계는 전부 이 값만 읽는다 — 외화만 DECIMAL이다.
              - column:
                  name: amount
                  type: BIGINT
                  constraints:
                    nullable: false
              # FOOD · TRANSPORT · STAY · SIGHT · SHOPPING · ETC. 테이블을 만들지 않는다(§4.1) —
              # 사용자 정의 분류를 허용하는 순간 관리 화면·순서·삭제 시 재배정이 따라온다.
              # NULL은 미분류이고 화면이 「정리할 내역 N건」으로 잡는다.
              - column:
                  name: category
                  type: VARCHAR(20)
              # ledger_asset을 옮기지 않은 자리다(§4.2). 잔액을 볼 원장이 사라졌고, 남은 것은
              # 「어디서 냈더라」를 나중에 읽는 일뿐이라 라벨 한 칸으로 충분하다.
              - column:
                  name: payment_method
                  type: VARCHAR(40)
              # CONFIRMED · SCHEDULED. 게이지 두 겹이 이 값이다. 예정을 확정으로 올려 주는
              # 스케줄러를 만들지 않는다(§4.3) — 실제 결제 여부를 앱이 알 수 없다.
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: CONFIRMED
                  constraints:
                    nullable: false
              - column:
                  name: fx_currency
                  type: VARCHAR(3)
              - column:
                  name: fx_amount
                  type: DECIMAL(18,2)
              # 쓴 날의 값으로 굳는다. 조회할 때 재계산하지 않는다(§4.3) —
              # 재계산하면 지난 여행의 총액이 매일 바뀐다.
              - column:
                  name: fx_rate
                  type: DECIMAL(18,6)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              # 소프트 삭제. 되돌리기는 화면 토스트에서 즉시만 열고 휴지통을 만들지 않는다(§4.4).
              - column:
                  name: deleted_at
                  type: DATETIME(6)
        # 화면이 읽는 유일한 경로다. 여행 하나를 날짜순으로 읽어 「출발 전 / N일차 / 다녀온 뒤」로
        # 나눈다 — 옛 idx_ledger_tx_trip이 하던 일과 같은 모양이다.
        - createIndex:
            tableName: trip_expense
            indexName: idx_trip_expense_trip_date
            columns:
              - column:
                  name: trip_id
              - column:
                  name: occurred_on
        # ON DELETE CASCADE — ledger_transaction.trip_id의 SET NULL과 정반대다.
        # 「여행을 지워도 쓴 돈은 원장에 남는다」가 SET NULL의 이유였는데, 남을 원장이
        # 없어졌다. 준비 항목(trip_prep_item)과 같은 취급이 된다: 그 여행이 없으면
        # 그 지출도 뜻이 없다.
        - addForeignKeyConstraint:
            baseTableName: trip_expense
            baseColumnNames: trip_id
            constraintName: fk_trip_expense_trip
            referencedTableName: trip
            referencedColumnNames: id
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: trip_expense

  - changeSet:
      id: 070-migrate-ledger-trip-expenses
      author: wcorn
      comment: |
        가계부에 적힌 여행 지출을 trip_expense로 옮긴다.

        이관은 복사다 — ledger_transaction의 원본을 지우지 않는다. 원본은 가계부 제거
        3단계(#1410)에서 테이블째 사라진다. 그 사이 두 벌이 공존하지만 경비 화면은
        이미 trip_expense만 읽는다.

        검증: 이관 전후로 각 여행의 확정 지출 합계가 같아야 한다. 다르면 배포를 멈춘다.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: ledger_transaction
      changes:
        # 손으로 INSERT 하지 않는다 — 로컬·테스트·운영이 갈라진다.
        #
        # 대상은 그 여행에 붙은 안 지운 지출뿐이다. 이체와 수입은 애초에 경비 화면에
        # 없었고(카드 대금 납부가 여행 경비로 새는 구멍이었다), 여기에도 오지 않는다.
        #
        # 카테고리는 자동으로 다 하려 들지 않는다. 가계부 분류는 사용자가 늘린 것이라
        # 프리셋 여섯에 딱 떨어지지 않는다 — 이름이 확실한 것만 옮기고 나머지는 NULL로
        # 둔다. 화면이 「정리할 내역 N건」으로 잡아 주는 길이 이미 있다.
        - sql:
            sql: >-
              INSERT INTO trip_expense
                (trip_id, member_id, occurred_on, title, amount, category, payment_method,
                 status, fx_currency, fx_amount, fx_rate, created_at, updated_at)
              SELECT t.trip_id,
                     t.member_id,
                     t.occurred_on,
                     LEFT(t.title, 100),
                     t.amount,
                     CASE c.name
                       WHEN '식비'      THEN 'FOOD'
                       WHEN '카페/간식' THEN 'FOOD'
                       WHEN '식사'      THEN 'FOOD'
                       WHEN '외식'      THEN 'FOOD'
                       WHEN '교통'      THEN 'TRANSPORT'
                       WHEN '교통비'    THEN 'TRANSPORT'
                       WHEN '숙소'      THEN 'STAY'
                       WHEN '숙박'      THEN 'STAY'
                       WHEN '관광'      THEN 'SIGHT'
                       WHEN '입장료'    THEN 'SIGHT'
                       WHEN '쇼핑'      THEN 'SHOPPING'
                       WHEN '기념품'    THEN 'SHOPPING'
                       WHEN '기타'      THEN 'ETC'
                       ELSE NULL
                     END,
                     LEFT(a.name, 40),
                     t.status,
                     t.fx_currency,
                     t.fx_amount,
                     t.fx_rate,
                     t.created_at,
                     t.updated_at
              FROM ledger_transaction t
              LEFT JOIN ledger_asset a ON a.id = t.asset_id
              LEFT JOIN ledger_category c ON c.id = t.category_id
              WHERE t.trip_id IS NOT NULL
                AND t.type = 'EXPENSE'
                AND t.deleted_at IS NULL
      rollback:
        # 이관으로 들어온 것만 지운다는 표시가 없다 — 이 체인지셋이 돌던 시점의
        # trip_expense는 비어 있었으므로(위 changeSet이 방금 만든 테이블이다) 전부가 그것이다.
        - sql:
            sql: DELETE FROM trip_expense
