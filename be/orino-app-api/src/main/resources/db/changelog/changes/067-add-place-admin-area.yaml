databaseChangeLog:
  # 장소의 광역 행정구역 (#1375).
  #
  # 자동 롤백에 맡기지 않고 dropColumn을 직접 적는다 — 066과 같은 이유다.

  - changeSet:
      id: 067-add-place-admin-area
      author: wcorn
      comment: 도시 꼬리표가 쓸 광역 행정구역. 시가 갈려도 현은 같다(#1375).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: travel_place
                columnName: admin_area
      changes:
        - addColumn:
            tableName: travel_place
            columns:
              # `administrative_area_level_1` — 나라현·오사카부·도쿄도.
              #
              # `city_name`(locality)을 두고 이걸 따로 두는 이유는 **같은 도시가 여러 글자로
              # 보이기 때문**이다. 구글이 주는 locality는 장소마다 갈린다 — 한국어가 있는
              # 것과 없는 것(`나라시` / `Nara`)이 섞이고, 경계 근처 장소는 인접 시로 잡힌다
              # (나라마치 → `야마토코리야마시`). 사용자에게는 전부 「나라」인데 화면이 세
              # 가지로 말한다.
              #
              # 현은 그 셋을 하나로 묶는다. 대신 단위가 여행의 기준 도시(`오사카시`)와
              # 어긋날 수 있는데, 흔들리는 이름보다 낫다고 봤다.
              #
              # NULL은 「아직 모른다」다 — 담을 때 못 받았거나 이 칼럼이 생기기 전에 담긴
              # 장소다. 그때는 화면이 `city_name`으로 떨어진다.
              - column:
                  name: admin_area
                  type: VARCHAR(100)
      rollback:
        - dropColumn:
            tableName: travel_place
            columns:
              - column:
                  name: admin_area
