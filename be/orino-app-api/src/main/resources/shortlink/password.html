<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>orino</title>
<style>
:root {
  --bg: #fafafa;
  --bg: oklch(0.985 0 0);
  --fg: #0a0a0a;
  --fg: oklch(0.12 0 0);
  --muted: #737373;
  --muted: oklch(0.45 0 0);
  --line: #e5e5e5;
  --line: oklch(0.925 0 0);
  --field: #ffffff;
  --field: oklch(1 0 0);
  --brand: #8b00ff;
  --brand: oklch(0.55 0.22 297.5);
  --brand-fg: #fcfcfc;
  --brand-fg: oklch(0.99 0 0);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a0a;
    --bg: oklch(0.115 0 0);
    --fg: #ededed;
    --fg: oklch(0.94 0 0);
    --muted: #a1a1a1;
    --muted: oklch(0.7 0 0);
    --line: #2e2e2e;
    --line: oklch(0.27 0 0);
    --field: #171717;
    --field: oklch(0.145 0 0);
    --brand: #9420ff;
    --brand: oklch(0.58 0.22 297.5);
  }
}
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
p { margin: 0; }
form { display: flex; gap: 8px; }
input {
  width: 180px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--field);
  color: var(--fg);
  font: inherit;
  font-size: 15px;
  outline: none;
}
input:focus { border-color: var(--brand); }
button {
  height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 8px;
  background: var(--brand);
  color: var(--brand-fg);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.note { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<svg width="28" height="28" viewBox="0 0 100 100" fill="none" role="img" aria-label="orino">
<mask id="m"><rect width="100" height="100" fill="#fff"/><circle cx="72.27" cy="27.73" r="12.9" fill="#000"/></mask>
<circle cx="49.14" cy="50.86" r="26.66" fill="none" stroke="var(--fg)" stroke-width="9.46" mask="url(#m)"/>
<circle cx="72.27" cy="27.73" r="10.32" fill="var(--brand)"/>
</svg>
<p>__MESSAGE__</p>
<form method="post">
<input type="password" name="password" aria-label="비밀번호" autocomplete="off" autofocus>
<button type="submit">열기</button>
</form>
</body>
</html>
