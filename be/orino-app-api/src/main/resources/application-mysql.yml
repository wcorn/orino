# `hibernate.jdbc.time_zone`을 두지 않는다. 이 애플리케이션은 일정 시각을 **벽시계 시각**
# (`DATE` + `TIME`)으로 저장하는데, 그 속성이 붙으면 Hibernate가 `LocalTime`을 JVM 기본
# 타임존으로 해석해 설정한 타임존으로 환산해 넣는다. JVM TZ가 UTC가 아닌 순간 `TIME` 값이
# 통째로 밀린다(#1201). `Instant`(`created_at`)는 이 속성 없이도 UTC로 저장되므로 잃는 것이 없다.
#
# JDBC URL에 `serverTimezone`도 두지 않는다. 서버는 UTC인데 `Asia/Seoul`이라 선언하고 있었고,
# 실측 결과 이 파라미터는 위 현상에 아무 영향이 없었다 — 사실과 다른 선언만 남는다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}/${DB_NAME}?useUnicode=true&charset=utf8mb4
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}/${DB_NAME}?useUnicode=true&charset=utf8mb4
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        generate_statistics: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mysql:8.4.4:///toy
    username: test
    password: test
    # 통합 테스트는 단일 TestContainer MySQL을 여러 Spring 컨텍스트가 공유한다.
    # 컨텍스트마다 Hikari 풀이 붙고 캐시된 컨텍스트가 커넥션을 물고 있어, 컨텍스트 수가
    # 늘면 MySQL max_connections(기본 151)를 넘겨 SQLNonTransientConnectionException이 난다.
    # 풀을 작게 잡고 유휴 시 0까지 반납하게 해 커넥션 누적을 막는다.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  tracing:
    enabled: false
