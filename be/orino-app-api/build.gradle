plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':orino-core-web')
    implementation project(':orino-domain-rdb')
    implementation project(':orino-domain-redis')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // 노트 이미지 업로드: MinIO(S3 호환) presigned PUT URL 발급
    implementation platform('software.amazon.awssdk:bom:2.34.0')
    implementation 'software.amazon.awssdk:s3'
    // OG 프리뷰 fetch(#1243). DNS 해석 결과를 우리가 고른 IP로 고정해 연결해야 하는데
    // (SSRF·DNS 재바인딩 방어), JDK HttpClient에는 DNS를 갈아끼울 자리가 없다.
    // OkHttp의 Dns 인터페이스가 그 자리다 — 검사에 통과한 주소만 돌려준다.
    implementation 'com.squareup.okhttp3:okhttp:5.2.1'
    // 가계부 이관(#1268 · D-6). 엑셀을 BE에서 읽고 쓴다 — 중복 검사가 원장 전체를
    // 조회해야 하고, 자동 분류 규칙은 수동 입력과 SSOT를 나눠 갖기 때문이다.
    // poi-ooxml은 .xlsx만 다룬다. 구형 .xls(poi-scratchpad·HSSF)는 받지 않는다 —
    // 쓰는 사람이 없는 형식을 위해 스캔 대상을 넓히지 않는다.
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 리다이렉트·본문 크기 제한을 진짜 HTTP로 확인한다.
    testImplementation 'com.squareup.okhttp3:mockwebserver3-junit5:5.2.1'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'com.redis:testcontainers-redis:2.2.4'
    // orino-domain-redis는 implementation이라 그 안의 Spring Data Redis 타입이 테스트에
    // 안 보인다. 캐시 저장소를 테스트에서 갈아끼우려면 필요하다.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.security:spring-security-test'
}
