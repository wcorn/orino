apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "9090"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-mysql
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.env.MYSQL_HOST }} 3306; do
                echo "Waiting for MySQL..."
                sleep 2
              done
        - name: wait-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.env.REDIS_HOST }} {{ .Values.env.REDIS_PORT }}; do
                echo "Waiting for Redis..."
                sleep 2
              done
      containers:
        - name: be
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 8080
            - name: actuator
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
            - name: MYSQL_HOST
              value: {{ .Values.env.MYSQL_HOST | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: REDIS_HOST
              value: {{ .Values.env.REDIS_HOST | quote }}
            - name: REDIS_PORT
              value: {{ .Values.env.REDIS_PORT | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            # 노트 이미지 presigned URL 발급용 MinIO 자격증명
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: rootPassword
            # Planner Google Calendar/Tasks 연동 OAuth 자격증명.
            # google-secret SealedSecret은 Google Cloud Console 발급값으로 별도 등록한다(Epic #472 선행작업).
            # 미등록 상태에서도 기동되도록 optional:true (스캐폴딩 단계). redirect-uri는 비밀이 아니라 values로 주입.
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-secret
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-secret
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_REDIRECT_URI
              value: {{ .Values.env.GOOGLE_REDIRECT_URI | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              # endpoint deregister가 전파되어 새 트래픽이 끊길 때까지 대기한 뒤
              # SIGTERM이 전달되어 Spring graceful shutdown이 시작된다.
              exec:
                command: ["sh", "-c", "sleep 20"]
          # 기동 완료(Liquibase 마이그레이션 포함)까지 대기. 통과 전에는
          # liveness/readiness를 평가하지 않아 느린 기동에도 강제 재시작되지 않는다.
          # 최대 10s * 30 = 300s 허용.
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 9090
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 9090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 9090
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
