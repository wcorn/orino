# Grafana CloudWatch 데이터소스 자격증명 (#1153).
# terraform aws_iam_user.cloudwatch_readonly 가 만든 키 — GetMetricData·
# GetMetricStatistics·ListMetrics 만 가진 읽기 전용이다(infra/terraform/cloudwatch.tf).
# 기존 observability-s3 키(S3 읽기·쓰기)를 재사용하지 않는다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-cloudwatch-secret
  namespace: monitoring
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: grafana-cloudwatch-secret
      namespace: monitoring
    type: Opaque
