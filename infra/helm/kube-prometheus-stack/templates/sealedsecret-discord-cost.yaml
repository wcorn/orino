# 비용 알림 전용 Discord 웹훅 (#1153). 기존 alertmanager-discord-secret 과 별개다 —
# 비용 알림은 성격이 달라 같은 채널에 섞이면 파드 재시작 알림에 묻힌다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-discord-cost-secret
  namespace: monitoring
spec:
  encryptedData:
    DISCORD_WEBHOOK_URL: 
  template:
    metadata:
      name: alertmanager-discord-cost-secret
      namespace: monitoring
    type: Opaque
