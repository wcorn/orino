kube-prometheus-stack:
  prometheus:
    service:
      type: NodePort
      nodePort: 30090
    thanosService:
      enabled: true
    prometheusSpec:
      enableFeatures:
        - exemplar-storage
      retention: 7d
      thanos:
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore-secret
            key: objstore.yml
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  # kube-scheduler/kube-proxy 메트릭은 127.0.0.1 바인딩이라 스크랩 불가 →
  # 끄지 않으면 TargetDown/ScrapeTargetDown 상시 firing(노이즈). 스크랩 비활성.
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubelet:
    enabled: true

  grafana:
    # admin 자격증명은 SealedSecret(grafana-admin-secret)으로 관리한다.
    # values 평문 adminPassword는 persistence DB 비밀번호와 어긋나
    # datasource sidecar의 provisioning reload가 401로 실패하던 문제를 유발했다.
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    # 표준 대시보드 비활성화 — 안 보는 대시보드는 노이즈.
    # 실제로 쓰는 커스텀 대시보드(SLO·Logs)만 grafana_dashboard ConfigMap으로 프로비저닝.
    defaultDashboardsEnabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      type: NodePort
      nodePort: 30300
    # persistence 비활성화 — datasource·대시보드·admin을 모두 GitOps
    # provisioning(코드)으로 관리하므로 PVC는 stale 상태만 보존해 드리프트를
    # 유발했다(옛 datasource uid가 남아 provisioning reload가 500으로 실패).
    # stateless로 두면 매 시작 시 코드 기준으로 깨끗하게 재구성된다.
    persistence:
      enabled: false
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          derivedFields:
            - name: traceId
              matcherRegex: '"traceId":"([a-f0-9]+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
              urlDisplayLabel: Tempo
      - name: Thanos
        type: prometheus
        # uid 고정 — 대시보드 JSON이 datasource를 uid로 참조한다. 비워 두면 Grafana가
        # 매번 임의 uid를 만들어 stateless 재기동 때마다 패널이 데이터소스를 잃는다.
        # (S3 비용 대시보드는 7일 넘는 추이를 봐야 해서 Prometheus 로컬 retention이
        #  아닌 Thanos를 봐야 한다 — #1153)
        uid: thanos
        url: http://thanos-query.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: false
        jsonData:
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            tags:
              - key: namespace
              - key: pod
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus

  alertmanager:
    # alertmanager.config를 직접 지정하지 않는다 → 차트 기본 config(null receiver +
    # Watchdog→null + inhibit_rules)를 그대로 사용. Watchdog(항상 firing)는 null로 버려진다.
    # 실제 Discord 라우팅은 AlertmanagerConfig CRD(orino-discord)가 catch-all로 담당한다.
    # (raw config에 discord를 넣으면 operator가 webhook_url_file를 거부해 전체가 null로
    #  fallback됐던 문제 회피 — CRD의 apiURL(SecretKeySelector)로 secret 안전 참조)
    alertmanagerSpec:
      # CRD 라우트를 네임스페이스로 가두지 않음 → orino 등 전 네임스페이스 알림 catch-all
      alertmanagerConfigMatcherStrategy:
        type: None
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        # scrape 시 버스트로 200m에서 25% CPU throttle 발생 → 300m로 상향.
        cpu: 300m
        memory: 128Mi
