apiVersion: batch/v1
kind: CronJob
metadata:
  name: ddns
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ddns
              image: {{ .Values.image | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  IP=$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
                  echo "$IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || { echo "invalid IP: '$IP'"; exit 1; }
                  echo "[ddns] WAN IP = $IP"
                  for NAME in $RECORDS; do
                    CUR=$(aws route53 list-resource-record-sets --hosted-zone-id "$ZONE_ID" \
                          --query "ResourceRecordSets[?Name=='${NAME}.' && Type=='A'].ResourceRecords[0].Value" \
                          --output text 2>/dev/null)
                    if [ "$CUR" = "$IP" ]; then echo "[ddns] $NAME 최신 ($IP)"; continue; fi
                    echo "[ddns] $NAME: ${CUR:-none} -> $IP 갱신"
                    aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" \
                      --change-batch "{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"${NAME}.\",\"Type\":\"A\",\"TTL\":${TTL},\"ResourceRecords\":[{\"Value\":\"${IP}\"}]}}]}" >/dev/null
                    echo "[ddns] $NAME 갱신 완료 -> $IP"
                  done
              env:
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.route53.region | quote }}
                - name: ZONE_ID
                  value: {{ .Values.route53.zoneId | quote }}
                - name: RECORDS
                  value: {{ .Values.route53.records | quote }}
                - name: TTL
                  value: {{ .Values.route53.ttl | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: route53-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: route53-credentials
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
