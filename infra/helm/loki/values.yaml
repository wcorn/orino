loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: orino-loki-logs
        ruler: orino-loki-logs
      s3:
        endpoint: s3.ap-northeast-2.amazonaws.com
        region: ap-northeast-2
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        s3ForcePathStyle: false

    # tsdb shipper 가 오브젝트 스토리지의 인덱스 테이블을 폴링하는 주기.
    # 기본 5m × 테이블 수만큼 LIST 가 나간다. 최근 3시간 데이터는 ingester 가
    # 직접 서빙하므로(query_ingesters_within) 이 주기를 늘려도 조회 신선도에
    # 영향이 없다. 차트 기본값의 index_gateway_client 와 딥머지된다 — #1114
    storage_config:
      tsdb_shipper:
        resync_interval: 30m

    limits_config:
      retention_period: 2160h
      # structured metadata 허용 (Alloy가 logger/requestId/userId/traceId를 부착).
      # tsdb + schema v13 전제이며 Loki 3.x 기본값이 true지만 의도를 명시.
      allow_structured_metadata: true

    # retention_period(90d)만으로는 아무것도 삭제되지 않는다. Loki는
    # compactor.retention_enabled 가 true 여야 retention 을 실제로 집행하며
    # 기본값이 false 다. 그래서 인덱스 테이블이 하루 1개씩 무한 증가했고
    # (실측 135개 = 90일치를 초과), tsdb shipper 가 5분마다 전 테이블을
    # LIST 하면서 S3 Tier1 39,744회/day 를 썼다 — AWS 청구 단일 최대 항목.
    # retention_enabled 시 delete_request_store 가 필수다(미설정 시 기동 실패).
    # apply_retention_interval 은 기본 0s(= compaction 주기 10m 마다)라
    # 90일 정책엔 과하다. 하루 1회로 충분 — #1114
    compactor:
      retention_enabled: true
      delete_request_store: s3
      apply_retention_interval: 24h

    # 로그 기반 알림(Loki Ruler). 룰 파일은 loki-alerting-rules ConfigMap을
    # /rules/fake 로 마운트(auth_enabled=false → 테넌트 id "fake").
    # 발동 알림은 monitoring 네임스페이스 Alertmanager로 전송 → 기존 Discord 라우팅 재사용.
    rulerConfig:
      storage:
        type: local
        local:
          directory: /rules
      rule_path: /tmp/loki/scratch
      alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
      enable_alertmanager_v2: true
      enable_api: true
      ring:
        kvstore:
          store: inmemory

  singleBinary:
    replicas: 1
    extraArgs:
      - -config.expand-env=true
    # Loki Ruler 룰 파일 마운트 (/rules/<tenant>/ 구조, 테넌트=fake)
    extraVolumes:
      - name: alerting-rules
        configMap:
          name: loki-alerting-rules
    extraVolumeMounts:
      - name: alerting-rules
        mountPath: /rules/fake
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: observability-s3-secret
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: observability-s3-secret
            key: AWS_SECRET_ACCESS_KEY
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

  # caching: 반복 LogQL 쿼리(Grafana 대시보드 새로고침)에서 S3 chunk GET 을 절감한다.
  # 서브차트가 memcached 를 자체 배포 — 기본값은 수 GB라 취미 클러스터에 맞게 작게 운용.
  chunksCache:
    enabled: true
    allocatedMemory: 256   # memcached -m, 기본 8192MB → 256MB
    allocatedCPU: 100m     # 기본 500m
    writebackSizeLimit: 50MB
  resultsCache:
    enabled: true
    allocatedMemory: 128   # 기본 1024MB → 128MB
    allocatedCPU: 100m
    defaultValidity: 12h

  gateway:
    enabled: false

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
