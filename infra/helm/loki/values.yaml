loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: orino-loki-logs
        ruler: orino-loki-logs
      s3:
        endpoint: s3.ap-northeast-2.amazonaws.com
        region: ap-northeast-2
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        s3ForcePathStyle: false
    limits_config:
      retention_period: 2160h

  singleBinary:
    replicas: 1
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: observability-s3-secret
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: observability-s3-secret
            key: AWS_SECRET_ACCESS_KEY
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

  # caching: 반복 LogQL 쿼리(Grafana 대시보드 새로고침)에서 S3 chunk GET 을 절감한다.
  # 서브차트가 memcached 를 자체 배포 — 기본값은 수 GB라 취미 클러스터에 맞게 작게 운용.
  chunksCache:
    enabled: true
    allocatedMemory: 256   # memcached -m, 기본 8192MB → 256MB
    allocatedCPU: 100m     # 기본 500m
    writebackSizeLimit: 50MB
  resultsCache:
    enabled: true
    allocatedMemory: 128   # 기본 1024MB → 128MB
    allocatedCPU: 100m
    defaultValidity: 12h

  gateway:
    enabled: false

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
