# 네임스페이스별 정책 정의
# - limitRange: 컨테이너 default/defaultRequest 값 (기존 파드 영향 없음, 신규 파드 안전망)
# - resourceQuota: 네임스페이스 총량 한도 (requests/limits 누적 합계)
#
# 신규 네임스페이스 추가 시 아래 namespaces 리스트에 항목을 추가한다.
# resourceQuota.enabled=false로 설정하면 해당 네임스페이스에는 LimitRange만 적용된다.

namespaces:
  - name: orino
    limitRange:
      enabled: true
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
    resourceQuota:
      enabled: true
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "12"
        memory: 12Gi

  - name: monitoring
    limitRange:
      enabled: true
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
    resourceQuota:
      enabled: true
      requests:
        # requests.cpu는 네임스페이스 reservation 캡. 관측 스택 requests 합(약 1845m)이
        # hard=2에 92% 도달해 KubeQuotaAlmostFull 발화·신규 파드 admission이 막힘.
        # 클러스터 총 32코어(2노드×16) 기준 3으로 상향해 여유 확보(약 61%).
        cpu: "3"
        memory: 8Gi
      limits:
        # limits.cpu는 네임스페이스 정책 상한(클러스터 총합 기준 버스트 상한, 예약/하드웨어 아님).
        # 8코어는 관측 스택 limit 합보다 작아 loki 캐시·tempo·admission job이 막혀 있었음.
        # 클러스터 총 32코어(2노드×16) 중 절반인 16으로 상향해 스택을 여유롭게 수용.
        cpu: "16"
        memory: 16Gi

  - name: argocd
    limitRange:
      enabled: true
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi
    resourceQuota:
      enabled: true
      # 현재 requests 합계 ~640m/1120Mi + 업그레이드 surge 대비 여유
      requests:
        cpu: "2"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 4Gi
