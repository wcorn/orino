alloy:
  alloy:
    configMap:
      content: |
        // ========================
        // OTLP 수신 (gRPC/HTTP)
        // ========================
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces  = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // Traces → Tempo
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo.monitoring.svc.cluster.local:4317"
            tls {
              insecure = true
            }
          }
        }

        // ========================
        // Faro receiver (FE 텔레메트리 수신)
        // ========================
        faro.receiver "app_receiver" {
          server {
            listen_address           = "0.0.0.0"
            listen_port              = 12347
            cors_allowed_origins     = ["https://orino.dev"]
            api_key                  = sys.env("FARO_API_KEY")
            max_allowed_payload_size = "10MiB"
            rate_limiting {
              rate = 100
            }
          }

          // FE 빌드(vite sourcemap: true)가 dist/assets/*.js.map을 함께 배포한다.
          // 브라우저 스택 트레이스의 minified URL을 보고 동일 origin의 .map을 받아와
          // unminified stack을 Grafana 에러 화면에 표시.
          sourcemaps {
            download = true
          }

          output {
            logs   = [loki.process.faro.receiver]
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // Faro 로그 전용 파이프라인: logfmt 파싱 후 app/kind를 스트림 라벨로 승격
        // 나머지 필드(session_id, trace_id, view_name 등)는 high-cardinality이므로 로그 내용에만 남김
        loki.process "faro" {
          stage.logfmt {
            mapping = {
              app  = "app_name",
              kind = "",
            }
          }

          stage.labels {
            values = {
              app  = "",
              kind = "",
            }
          }

          forward_to = [loki.write.default.receiver]
        }

        // ========================
        // Kubernetes Pod 로그 수집
        // ========================
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          // namespace 라벨
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          // pod 이름 라벨
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          // 컨테이너 이름 라벨
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          // app 라벨
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }

          // 로그 경로
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/$2/*.log"
          }
        }

        // /var/log/pods의 컨테이너 로그 파일을 직접 tail한다(promtail 표준 방식).
        // loki.source.kubernetes(API tailer)와 달리 discovery.relabel 라벨이
        // 파이프라인 스트림 라벨로 실려, stage.match selector가 정상 동작한다.
        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.json_parse.receiver]
          // 저장된 position이 없을 때 파일 끝부터 읽는다. 최초 전환·position
          // 유실 시 과거 로그를 재수집해 Loki retention('too old')을 때리는
          // 노이즈를 막는다(아래 hostPath position 저장과 함께).
          tail_from_end = true
        }

        // JSON 로그 파싱 (BE prod 로그: LogstashEncoder)
        loki.process "json_parse" {
          // /var/log/pods 파일은 CRI 포맷("<ts> <stream> <P|F> <log>")이므로
          // 먼저 stage.cri로 실제 로그 라인을 추출한다(부분 로그 F/P도 합침).
          stage.cri { }

          stage.json {
            expressions = {
              level       = "level",
              logger      = "logger_name",
              request_id  = "requestId",
              user_id     = "userId",
              trace_id    = "traceId",
              thread_name = "thread_name",
              message     = "message",
              stack_trace = "stack_trace",
              client_ip   = "client_ip",
              user_agent  = "user_agent",
            }
          }

          // level만 스트림 라벨로 승격 (저카디널리티 — 필터/대시보드 변수용)
          stage.labels {
            values = {
              level = "",
            }
          }

          // 나머지 고유 식별자는 structured metadata로 부착한다.
          // 라벨이 아니라 스트림 카디널리티를 늘리지 않으면서도,
          // Grafana 로그 패널에서 컬럼/필터로 바로 쓰고 `| json` 파싱이 불필요.
          // 식별 필드 + 예외 스택은 structured metadata로 보존한다(라벨 아님 →
          // 스트림 카디널리티 무관). 본문을 message로 줄여도 stack_trace는
          // 로그 디테일에서 그대로 조회된다.
          stage.structured_metadata {
            values = {
              logger      = "",
              request_id  = "",
              user_id     = "",
              trace_id    = "",
              thread_name = "",
              stack_trace = "",
              client_ip   = "",
              user_agent  = "",
            }
          }

          // istio-proxy(사이드카) 로그는 plain text라 자체 ts·level·scope를
          // 본문에 담는다(예: "2026-...Z\tinfo\txdsproxy\tconnected..."). ts·level을
          // 떼고 나머지(scope+메시지)를 message로 추출 → Grafana ts/level과 중복
          // 제거되고 본문이 짧아져 BE/FE와 통일된다. level은 라벨로 승격한다.
          stage.match {
            selector = "{container=\"istio-proxy\"}"
            stage.regex {
              expression = "^[^\\t]+\\t(?P<level>\\w+)\\t(?P<message>.*)$"
            }
            stage.labels {
              values = {
                level = "",
              }
            }
          }

          // BE JSON 로그는 본문을 message만 남긴다. message가 추출된 경우
          // (JSON 파싱 성공)에만 본문을 교체하고, FE nginx 등 plain text는
          // message 키가 없어 stage.output이 no-op 처리되어 원본 라인을 유지한다.
          // Go template 표현식은 alloy 차트의 Helm tpl 렌더와 충돌하므로 쓰지 않는다.
          stage.output {
            source = "message"
          }

          forward_to = [loki.write.default.receiver]
        }

        // Loki로 전송
        loki.write "default" {
          endpoint {
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

    # alloy 컴포넌트 상태(loki.source.file의 읽기 position 등)를 노드 hostPath에
    # 저장해 Pod 재시작에도 위치를 유지한다(로그 누락·중복 방지).
    storagePath: /var/lib/alloy
    # /var/log hostPath 마운트(read-only) — loki.source.file이 /var/log/pods의
    # 컨테이너 로그 파일을 직접 읽는다. position은 alloy-data(hostPath)에 저장.
    mounts:
      varlog: true
      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy

    # FARO_API_KEY 환경변수 주입 (alloy-faro-secret)
    envFrom:
      - secretRef:
          name: alloy-faro-secret

    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      - name: faro
        port: 12347
        targetPort: 12347
        protocol: TCP

  controller:
    type: daemonset
    volumes:
      extra:
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
