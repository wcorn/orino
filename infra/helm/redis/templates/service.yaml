apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379
---
# metrics는 내부 전용(ClusterIP). ServiceMonitor가 pod endpoints(9121)를
# 클러스터 내부에서 스크랩하므로 NodePort 외부 노출이 불필요하다.
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  labels:
    app: redis
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
