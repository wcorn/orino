{{- /*
공개 표면(s.orino.dev)의 rate limit. #1237 · Epic #1246.

기존 ratelimit-be는 api.orino.dev vhost에만 걸려 있어, 그대로 두면 새 공개 표면이
무방비로 열린다(아키텍처 §6). local_ratelimit HTTP 필터 자체는 ratelimit-be가 GATEWAY
컨텍스트에 이미 INSERT_BEFORE로 넣어 두었으므로, 여기서는 vhost별 설정만 얹는다.

vhost 이름은 "<host>:<Gateway 서버 포트>"다. 이 게이트웨이는 443 서버 하나뿐이므로
s.orino.dev:443이다 — :80으로 적으면 매치가 되지 않아 필터가 조용히 아무 일도 하지 않는다.
*/ -}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ratelimit-shortlink
  namespace: istio-ingress
spec:
  workloadSelector:
    labels:
      istio: gateway
  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: s.orino.dev:443
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/udpa.type.v1.TypedStruct
              type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              value:
                stat_prefix: http_local_rate_limiter
                # 버킷은 **route마다** 따로다(IP별이 아니다). applyTo가 HTTP_ROUTE라
                # 설정이 vhost가 아니라 그 안의 route 각각에 붙는다 — s.orino.dev는 route가
                # 넷이라(robots.txt · POST · GET · catch-all) 300짜리 버킷이 넷이고,
                # 게이트웨이 파드마다 또 따로다.
                #
                # 사람이 링크를 눌러 여는 속도와는 자릿수가 다르다. 다만 **열거를 막지는
                # 못한다** — 슬러그 공간은 32⁵ = 33,554,432인데(SlugPolicy: 알파벳 32자 ·
                # AUTO_LENGTH 5), 열거에 쓰이는 GET route가 파드당 300을 따로 가지므로
                # 파드 둘을 함께 쓰면 분당 600이다:
                #
                #   33,554,432 ÷ 600/분 = 55,924분 ≈ 39일
                #
                # 방어의 본체는 응답이 아무것도 알려주지 않는 것이고(명세 §7.1) 이건 그 위의
                # 보조다. 더 조이려면 IP별 버킷(remote_address descriptor)이 있어야 한다 —
                # 지금 구조에서 값만 낮추면 정상 사용자가 먼저 막힌다(#1299).
                token_bucket:
                  max_tokens: 300
                  tokens_per_fill: 300
                  fill_interval: 60s
                filter_enabled:
                  runtime_key: local_rate_limit_enabled
                  default_value:
                    numerator: 100
                    denominator: HUNDRED
                filter_enforced:
                  runtime_key: local_rate_limit_enforced
                  default_value:
                    numerator: 100
                    denominator: HUNDRED
                response_headers_to_add:
                  - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    header:
                      key: X-RateLimit-Limit
                      value: "300"
