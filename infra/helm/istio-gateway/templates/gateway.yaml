apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: orino-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: gateway
  servers:
    # 443 HTTPS 전용(공유기 443만 포워딩). cert-manager 발급 TLS secret(orino-tls)으로 종단. (#456)
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: orino-tls
      hosts:
        - "orino.dev"
        - "*.orino.dev"
