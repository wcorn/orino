{{- /*
api.orino.dev의 rate limit. #1248.

vhost 이름은 "<host>:<Gateway 서버 포트>"다. 이 게이트웨이는 443 서버 하나뿐이라
(#456에서 Cloudflare를 걷어내고 공유기가 443만 포워딩한다) api.orino.dev:443이다.

:80으로 적혀 있던 동안 이 패치는 **붙을 자리를 못 찾았고, Envoy는 경고 없이 넘어갔다.**
HTTP_FILTER 패치(필터를 체인에 넣는 쪽)는 vhost 이름을 보지 않아 정상 적용됐기 때문에,
config_dump에 필터는 보이는데 토큰 버킷을 든 per-route 설정만 없는 상태였다 —
겉보기엔 제한이 걸린 것처럼 보이는 실패였다. 확인은 렌더링이 아니라 적용 결과로 한다:
vhost의 per_filter에 local_ratelimit이 실제로 들어 있는지 본다.
*/ -}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ratelimit-be
  namespace: istio-ingress
spec:
  workloadSelector:
    labels:
      istio: gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: http_local_rate_limiter
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: api.orino.dev:443
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.local_ratelimit:
              "@type": type.googleapis.com/udpa.type.v1.TypedStruct
              type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              value:
                stat_prefix: http_local_rate_limiter
                # 실측으로 정한 값(30일, Prometheus). 아래 숫자가 근거다.
                #
                #   성공(2xx) 분당 최대   246   ← 사람이 실제로 쓴 양의 꼭대기
                #   2xx가 100을 넘은 분      2   (43,200분 중)
                #   2xx가 200을 넘은 분      1
                #
                # 100으로 두면 정상 사용에서 429가 났을 값이다. 600은 실측 꼭대기의
                # 2.4배 — **평소에는 절대 걸리지 않고**, 폭주만 막는 자리다.
                #
                # 버킷은 **route마다** 따로다(IP별이 아니다). applyTo가 HTTP_ROUTE라
                # 설정이 vhost가 아니라 그 안의 route 각각에 붙는다.
                #
                # api.orino.dev는 VirtualService에 match가 없어 route가 하나뿐이라, 지금은
                # 「vhost 전체가 하나의 버킷」과 결과가 같다 — 다만 **그건 우연이다.**
                # match를 하나 넣는 순간 버킷이 조용히 두 배가 된다. 파드가 2개이므로
                # 지금 전체 상한은 분당 1,200이다.
                token_bucket:
                  max_tokens: 600
                  tokens_per_fill: 600
                  fill_interval: 60s
                filter_enabled:
                  runtime_key: local_rate_limit_enabled
                  default_value:
                    numerator: 100
                    denominator: HUNDRED
                filter_enforced:
                  runtime_key: local_rate_limit_enforced
                  default_value:
                    numerator: 100
                    denominator: HUNDRED
                response_headers_to_add:
                  - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    header:
                      key: X-RateLimit-Limit
                      value: "600"
