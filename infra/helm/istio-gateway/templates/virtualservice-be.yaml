{{- /*
api.orino.dev의 라우팅.

corsPolicy는 **라우트마다** 붙는다. 라우트를 하나 더 만들면 그쪽에도 똑같이 적어야
한다 — Authorization 헤더를 싣는 요청은 프리플라이트를 타고, corsPolicy가 없는
라우트가 OPTIONS를 받으면 브라우저가 응답을 버린다. 서버 로그에는 200만 남는다.
*/ -}}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: be
  namespace: istio-ingress
spec:
  hosts:
    - "api.orino.dev"
  gateways:
    - orino-gateway
  http:
    # ── 전부 하나로 ──────────────────────────────────────────────
    #
    # 가계부 가져오기(#1379)가 여기 라우트를 하나 더 갖고 있었다. 파일을 올려 전부
    # 파싱하고 거래를 insert하는 일이라 아래 10초 안에 끝나지 않았고, 120초 타임아웃과
    # 재시도 0이 필요했다. 가계부가 없어지면서(#1405) 그 라우트도 함께 사라졌다.
    #
    # 표 가져오기(.xlsx)는 그 자리를 물려받지 않는다. 시트를 셀 격자로 읽어 그대로
    # 저장할 뿐이고, 기본 라우트 안에서 끝난다.
    - name: default
      corsPolicy:
        allowOrigins:
          - exact: "https://orino.dev"
          - exact: "http://orino.dev"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - Authorization
          - Content-Type
          - X-Timezone
        # 파일 내려받기(표 .xlsx)는 파일 이름을 이 헤더로 받는다. 브라우저는 CORS 응답에서
        # 안전 목록 밖 헤더를 JS에 숨기므로, 여기서 열어주지 않으면 화면이 이름을 못 읽어
        # 언제나 기본 이름으로 저장된다 — orino.dev와 api.orino.dev가 서로 다른 오리진이라
        # 로컬(같은 오리진 프록시)에서는 드러나지 않는다.
        exposeHeaders:
          - Content-Disposition
        allowCredentials: true
        maxAge: "86400s"
      timeout: 10s
      # 재시도 조건은 connect-failure **뿐**이다(#1379).
      #
      # 5xx와 reset은 요청이 이미 서버에 닿아 처리된 뒤에도 걸린다. 이 라우트로는
      # 지출 입력 같은 비멱등 POST가 지나가므로, 3초를 넘긴 요청이 조용히 두 번 더
      # 들어갈 수 있다. connect-failure는 연결 자체가 안 된 경우라 서버가 요청을 본 적이
      # 없다 — 어떤 메서드에도 안전하다.
      #
      # 롤아웃 중 죽는 파드는 DestinationRule의 outlierDetection이 빼낸다.
      retries:
        attempts: 2
        retryOn: connect-failure
        perTryTimeout: 3s
      route:
        - destination:
            host: be.orino.svc.cluster.local
            port:
              number: 8080
