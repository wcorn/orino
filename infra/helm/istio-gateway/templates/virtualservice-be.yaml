apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: be
  namespace: istio-ingress
spec:
  hosts:
    - "api.orino.dev"
  gateways:
    - orino-gateway
  http:
    - corsPolicy:
        allowOrigins:
          - exact: "https://orino.dev"
          - exact: "http://orino.dev"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - Authorization
          - Content-Type
          - X-Timezone
        # 파일 내려받기(표 .xlsx · 원장 CSV/xlsx)는 파일 이름을 이 헤더로 받는다.
        # 브라우저는 CORS 응답에서 안전 목록 밖 헤더를 JS에 숨기므로, 여기서 열어주지 않으면
        # 화면이 이름을 못 읽어 언제나 기본 이름으로 저장된다 — orino.dev와 api.orino.dev가
        # 서로 다른 오리진이라 로컬(같은 오리진 프록시)에서는 드러나지 않는다.
        exposeHeaders:
          - Content-Disposition
        allowCredentials: true
        maxAge: "86400s"
      timeout: 10s
      retries:
        attempts: 2
        retryOn: 5xx,reset,connect-failure
        perTryTimeout: 3s
      route:
        - destination:
            host: be.orino.svc.cluster.local
            port:
              number: 8080
