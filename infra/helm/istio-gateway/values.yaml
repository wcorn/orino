gateway:
  service:
    # Cloudflare 제거 → 집 회선 직결(#456). MetalLB가 LAN VIP 192.168.0.240 할당,
    # 공유기 443 → .240 포워딩. 80은 전환 중 cloudflared 내부 경로용으로 유지.
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.0.240"

    # 클라이언트 IP를 게이트웨이까지 보낸다(#1301).
    #
    # Cluster였을 때 실측한 것: 노드를 넘어가는 요청은 kube-proxy가 SNAT해서, Envoy가
    # 보는 "클라이언트"가 **대표 노드의 Calico IPIP 터널 주소 하나**였다
    # (10.244.139.64 = note2의 IPv4IPIPTunnelAddr). 절반쯤의 트래픽이 그 주소 하나로
    # 뭉치므로, 이 상태에서 IP별 rate limit(remote_address descriptor)을 붙이면
    # 나눈 것처럼 보이면서 실제로는 더 거칠어진다.
    #
    # Local은 SNAT을 없애 진짜 IP를 남긴다. 대신 트래픽을 다른 노드로 넘겨주지 않으므로
    # **알리는 노드에 준비된 파드가 있어야 한다** — MetalLB가 그 조건을 보고 알림 노드를
    # 고르고(L2 모드), 위 topologySpread·strategy가 그 조건을 항상 만족시킨다.
    externalTrafficPolicy: Local

  # 외부 트래픽 진입점이므로 HA 구성 (최소 2 replica)
  replicaCount: 2

  # 파드를 노드에 나눠 둔다(#1301). externalTrafficPolicy: Local에서는 MetalLB가
  # **준비된 엔드포인트가 있는 노드에서만** LB IP를 알린다 — 한 노드에 몰리면 그 노드가
  # 곧 단일 장애점이 된다.
  #
  # 처음엔 ScheduleAnyway로 뒀는데 **안 지켜졌다.** 전환 롤아웃에서 새 파드 둘이 모두
  # note2로 갔다(권고라 스케줄러가 무시할 수 있다). 그래서 DoNotSchedule로 올린다.
  #
  # matchLabelKeys가 이걸 가능하게 한다. 노드가 둘뿐이라 그냥 강제하면 롤아웃 중
  # 세 번째 파드가 놓일 자리가 없어 멈추는데, pod-template-hash로 범위를 나누면
  # **새 ReplicaSet의 파드끼리만** 견주므로 옛 파드가 자리를 막지 않는다.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          istio: gateway

  # 새 파드가 준비된 뒤에 옛 파드를 내린다(#1301).
  #
  # 기본값(maxUnavailable 25% = 1개)이면 롤아웃 중 파드가 1개로 떨어지는 순간이 있다.
  # externalTrafficPolicy: Local에서는 그 순간 MetalLB가 알림 노드를 옮겨야 하고,
  # ARP가 다시 수렴하는 동안 몇 초가 흔들린다. 0으로 두면 그 순간 자체가 없다.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # rate limit이 걸리는지 보이게 한다(#1305).
  #
  # Istio는 프록시 통계를 걸러 내보낸다(기본 노출 접두사: cluster · cluster_manager ·
  # istiocustom · listener_manager · server). 그래서 local_ratelimit이 실제로 429를
  # 내도 **어느 지표에도 안 남았다** — istio_requests_total은 라우팅 전에 끊긴 로컬
  # 응답을 아예 보지 못하고, Envoy 자체 카운터는 이 필터에 걸려 빠졌다.
  #
  # 접두사는 필터의 stat_prefix다(envoyfilter-ratelimit*.yaml의 http_local_rate_limiter).
  # 실제 통계 이름은 Envoy 1.37로 확인했다:
  #   http_local_rate_limiter.http_local_rate_limit.{enabled,enforced,ok,rate_limited}
  # 추측해서 열면 열어 놓고도 아무것도 안 나오는 상태가 된다 — 이 이슈가 고치려는 것이
  # 정확히 그런 조용한 실패다.
  #
  # 파드당 시계열 4개다. 통계를 함부로 열면 시계열이 폭증하므로(ELOG-008) 이것만 연다.
  podAnnotations:
    sidecar.istio.io/statsInclusionPrefixes: "http_local_rate_limiter"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  # 최소 1개 유지하여 노드 재시작/롤링 업데이트 중 트래픽 단절 방지
  podDisruptionBudget:
    minAvailable: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
