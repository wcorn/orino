<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>orino</title>
<style>
:root {
  --bg: #fafafa;
  --bg: oklch(0.985 0 0);
  --fg: #0a0a0a;
  --fg: oklch(0.12 0 0);
  --brand: #8b00ff;
  --brand: oklch(0.55 0.22 297.5);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a0a;
    --bg: oklch(0.115 0 0);
    --fg: #ededed;
    --fg: oklch(0.94 0 0);
    --brand: #9420ff;
    --brand: oklch(0.58 0.22 297.5);
  }
}
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
p { margin: 0; }
</style>
</head>
<body>
<svg width="28" height="28" viewBox="0 0 100 100" fill="none" role="img" aria-label="orino">
<mask id="m"><rect width="100" height="100" fill="#fff"/><circle cx="72.27" cy="27.73" r="12.9" fill="#000"/></mask>
<circle cx="49.14" cy="50.86" r="26.66" fill="none" stroke="var(--fg)" stroke-width="9.46" mask="url(#m)"/>
<circle cx="72.27" cy="27.73" r="10.32" fill="var(--brand)"/>
</svg>
<p>이 링크는 사용할 수 없습니다</p>
</body>
</html>
