# ArgoCD 본체 values. 단일 진실(single source of truth)로 두 경로가 공유한다:
#   1. 최초 설치(chicken-and-egg): Ansible argocd_bootstrap role 이
#      `helm upgrade --install argocd argo/argo-cd --version 9.4.10 -f <이 파일>` 로 부트스트랩.
#   2. 이후 업그레이드: 자기관리 Application(infra/argocd/applications/argocd-app.yaml)이
#      이 파일을 $values 로 참조해 GitOps 자동 반영(self-heal). 수동 helm upgrade 불필요.
# 차트 버전(9.4.10)을 올릴 때는 argocd-app.yaml 의 targetRevision 과
# argocd_bootstrap 의 chart_version 을 함께 맞춘다.

configs:
  params:
    server.insecure: true

# StatefulSet: 실 사용량 ~80m CPU / ~370Mi — 여유 있게 설정
controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      # 자기관리 편입으로 관리 앱이 1개 늘어 reconcile 부하 증가 → 500m에서 29% throttle.
      cpu: 750m
      memory: 1Gi

server:
  extraArgs:
    - --loglevel=info
  service:
    type: NodePort
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Git 클론/렌더링 담당. 평상시 ~16m / ~74Mi
# 단, kube-prometheus-stack/alloy 등 큰 차트 렌더링 시 메모리 spike 발생 (OOM 방지 위해 여유있게 설정)
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # 매니페스트 생성 버스트로 500m에서 32% CPU throttle 발생 → 750m로 상향.
      cpu: 750m
      memory: 768Mi

# ApplicationSet 미사용 중이지만 App of Apps 보완재로 구동
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      # 평상 사용량이 ~57Mi라 64Mi limit의 90%에 상시 근접(ContainerMemoryNearLimit) → 128Mi.
      memory: 128Mi

notifications:
  # 컨트롤러만 이 차트가 띄운다. config(cm/secret)는 전용 argocd-notifications 앱이 소유하므로
  # 차트는 cm/secret을 만들지 않는다(동일 객체 경합 → 영구 OutOfSync 방지).
  cm:
    create: false
  secret:
    create: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
