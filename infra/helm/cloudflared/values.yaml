image:
  repository: cloudflare/cloudflared
  tag: "2026.5.0"

replicas: 2

# Tunnel token이 들어있는 Secret (SealedSecret으로 관리)
tokenSecret:
  name: cloudflared-tunnel
  key: token

metrics:
  port: 2000
  serviceMonitor:
    enabled: true
    interval: 30s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
