image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.41.0

objstoreSecret: thanos-objstore-secret

query:
  replicas: 1
  stores:
    - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.monitoring.svc.cluster.local
    - dnssrv+_grpc._tcp.thanos-storegateway.monitoring.svc.cluster.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

storegateway:
  replicas: 1
  storageClass: longhorn
  storageSize: 5Gi
  # caching bucket: S3 GET 요청 절감(메타/청크 subrange 를 memcached 캐싱)
  cachingBucket:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# store-gateway caching-bucket 외부 backend (작게 — 취미 클러스터)
memcached:
  image: memcached:1.6.38-alpine
  allocatedMemoryMB: 256
  maxItemSize: 5m
  maxConnections: 1024
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 320Mi

compactor:
  retentionRaw: 30d
  retention5m: 90d
  retention1h: 365d
  # 컴팩션 루프 주기(기본 5m). 매 iteration마다 전체 블록의 meta.json GET +
  # 마커 파일 HEAD를 캐시 없이 재조회해 S3 요청료가 발생한다
  # (caching bucket은 store-gateway 전용이라 compactor엔 적용 안 됨).
  # 취미 규모 단일 클러스터는 5분 주기가 무의미해 1h로 늘린다 — #1104
  waitInterval: 1h
  # 삭제 마킹된 블록 정리 주기(기본 5m). 위와 같은 이유로 1h.
  cleanupInterval: 1h
  storageClass: longhorn
  storageSize: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
