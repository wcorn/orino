apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-storegateway
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: storegateway
spec:
  replicas: {{ .Values.storegateway.replicas }}
  serviceName: thanos-storegateway
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: storegateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: storegateway
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: thanos-storegateway
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          args:
            - store
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            {{- if .Values.storegateway.cachingBucket.enabled }}
            # S3 메타/청크 subrange 를 memcached 에 캐싱해 GET 호출을 대폭 줄인다.
            - --store.caching-bucket.config-file=/etc/thanos-caching/caching-bucket.yml
            {{- end }}
          ports:
            - name: http
              containerPort: 9090
            - name: grpc
              containerPort: 10901
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/thanos/store
            - name: objstore-config
              mountPath: /etc/thanos
            {{- if .Values.storegateway.cachingBucket.enabled }}
            - name: caching-bucket-config
              mountPath: /etc/thanos-caching
            {{- end }}
          resources:
            {{- toYaml .Values.storegateway.resources | nindent 12 }}
      volumes:
        - name: objstore-config
          secret:
            secretName: {{ .Values.objstoreSecret }}
        {{- if .Values.storegateway.cachingBucket.enabled }}
        - name: caching-bucket-config
          configMap:
            name: thanos-caching-bucket
        {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storegateway.storageClass }}
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.storegateway.storageSize }}
